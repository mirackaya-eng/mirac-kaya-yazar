<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><title>Miraç Kaya | Kitap Yönetimi</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#070707,#2a0813);color:#fff;font-family:Arial,sans-serif;padding:24px}.wrap{max-width:900px;margin:auto}.panel{background:#111;border:1px solid #5a1b2d;border-radius:18px;padding:25px;box-shadow:0 20px 60px #0008}h1{font-family:Georgia,serif;font-size:36px;margin:0 0 8px}h2{margin-top:30px}p{color:#cdbfbd}label{display:block;margin:15px 0 7px;font-weight:700}input,textarea,select{width:100%;padding:13px;border-radius:8px;border:1px solid #4b222c;background:#080808;color:#fff;font-size:15px}textarea{min-height:100px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}button{border:0;border-radius:8px;padding:13px 18px;font-weight:800;cursor:pointer;background:#9d1732;color:#fff}.alt{background:#292929}.ok,.err{margin-top:16px;padding:12px;border-radius:8px}.ok{background:#173b25}.err{background:#45131f;color:#ffd9df}.hidden{display:none!important}.item{padding:14px;border:1px solid #39202a;border-radius:10px;margin-top:10px;display:flex;justify-content:space-between;gap:10px;align-items:center}.muted{color:#9e918f;font-size:13px}@media(max-width:650px){.grid{grid-template-columns:1fr}body{padding:12px}}</style></head><body><div class="wrap"><div id="app" class="panel"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><div><h1>Kitap Yönetim Paneli</h1><p>Kitap bilgilerini doğrudan buradan ekleyebilir, düzenleyebilir ve yayınlayabilirsin.</p></div><button id="logout" class="alt">ÇIKIŞ</button></div><form id="bookForm"><input id="id" type="hidden"><label>Kitap adı</label><input id="name" required><div class="grid"><div><label>Yazar</label><input id="author" value="Miraç Kaya"></div><div><label>Tür</label><input id="genre"></div></div><div class="grid"><div><label>Yayın yılı</label><input id="year"></div><div><label>Sayfa sayısı</label><input id="pages"></div></div><div class="grid"><div><label>Durum</label><select id="status"><option>Yakında</option><option>Yayında</option><option>Tükendi</option></select></div><div><label>Fiyat</label><input id="price" placeholder="Örn. 250 TL"></div></div><label>Satın alma / bilgi bağlantısı</label><input id="link" placeholder="https://..."><label>Kısa açıklama</label><textarea id="short"></textarea><label>Detaylı bilgi</label><textarea id="detail"></textarea><label>Alıntı</label><textarea id="quote"></textarea><label>Kapak görseli URL'si</label><input id="cover" placeholder="https://.../kapak.jpg"><label><input id="published" type="checkbox" style="width:auto"> Ziyaretçilere yayınla</label><div class="actions"><button type="submit">KİTABI KAYDET / YAYINLA</button><button type="button" id="clear" class="alt">FORMU TEMİZLE</button></div><div id="ok" class="ok hidden">Kitap başarıyla kaydedildi.</div><div id="err" class="err hidden"></div></form><h2>Kayıtlı Kitaplar</h2><div id="list"><p class="muted">Yükleniyor...</p></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const URL='https://hskohhdppvhwdfqausrp.supabase.co',KEY='sb_publishable_CBHqPR8qePHdGlQefycjUQ_SxH-X4fh',ADMIN='mirackaya1208@gmail.com';const sb=window.supabase.createClient(URL,KEY);const $=id=>document.getElementById(id);let books=[];function show(el,text,cls){el.textContent=text;el.className=cls}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}async function start(){const {data}=await sb.auth.getSession();if(data.session&&data.session.user.email?.toLowerCase()===ADMIN){await load();return}try{await sb.auth.signInWithOtp({email:ADMIN,options:{emailRedirectTo:location.href}})}catch(e){}}async function api(payload){const {data:{session}}=await sb.auth.getSession();if(!session)throw new Error('Bu panel yalnızca yönetici oturumuyla kullanılabilir. E-posta bağlantısını açıp sayfayı yenile.');const r=await fetch(URL+'/functions/v1/admin-books',{method:'POST',headers:{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify(payload)});const j=await r.json();if(!r.ok)throw new Error(j.error||'İşlem başarısız.');return j}async function load(){try{const j=await api({action:'list'});books=j.data||[];render()}catch(e){$('list').innerHTML='<p class="muted">Yönetici oturumu bekleniyor.</p>'}}$('bookForm').onsubmit=async e=>{e.preventDefault();$('err').classList.add('hidden');const b={id:$('id').value||undefined,name:$('name').value.trim(),author:$('author').value.trim(),genre:$('genre').value.trim(),publication_year:$('year').value,page_count:$('pages').value,status:$('status').value,price:$('price').value.trim(),purchase_link:$('link').value.trim(),short_description:$('short').value.trim(),detailed_info:$('detail').value.trim(),quote:$('quote').value.trim(),cover_image_url:$('cover').value.trim(),published:$('published').checked};try{await api({action:'upsert',book:b});show($('ok'),'Kitap başarıyla kaydedildi.','ok');clearForm();await load();setTimeout(()=>$('ok').classList.add('hidden'),2500)}catch(e){show($('err'),e.message,'err')}};function clearForm(){$('bookForm').reset();$('id').value='';$('author').value='Miraç Kaya'}$('clear').onclick=clearForm;async function del(id){if(!confirm('Bu kitabı silmek istediğine emin misin?'))return;try{await api({action:'delete',id});await load()}catch(e){show($('err'),e.message,'err')}}function edit(id){const b=books.find(x=>x.id===id);if(!b)return;$('id').value=b.id;$('name').value=b.name||'';$('author').value=b.author||'Miraç Kaya';$('genre').value=b.genre||'';$('year').value=b.publication_year||'';$('pages').value=b.page_count||'';$('status').value=b.status||'Yakında';$('price').value=b.price||'';$('link').value=b.purchase_link||'';$('short').value=b.short_description||'';$('detail').value=b.detailed_info||'';$('quote').value=b.quote||'';$('cover').value=b.cover_image_url||'';$('published').checked=!!b.published;scrollTo({top:0,behavior:'smooth'})}function render(){$('list').innerHTML=books.length?books.map(b=>`<div class="item"><div><b>${esc(b.name)}</b><div class="muted">${b.published?'YAYINDA':'TASLAK'} · ${esc(b.status||'')}</div></div><div><button class="alt" onclick="edit('${b.id}')">Düzenle</button> <button onclick="del('${b.id}')">Sil</button></div></div>`).join(''):'<p class="muted">Henüz kitap yok.</p>'}sb.auth.onAuthStateChange(()=>{if(location.href.includes('code=')||location.hash.includes('access_token'))setTimeout(start,500)});start();</script></body></html>
